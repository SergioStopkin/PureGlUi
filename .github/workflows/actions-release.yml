name: Release

on:
  pull_request:
    branches:
      - release

jobs:
  Main-Pipeline:
    runs-on:  ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Cache apt archives
        uses: actions/cache@v5
        with:
          path: /tmp/apt-archives
          key:  apt-${{hashFiles('.github/dependencies/linux')}}

      - name: Route apt downloads to the cache dir
        run: |
          # Pre-create lock + partial/ as the runner (no sudo) so sudo apt-get
          # reuses them instead of creating root-owned ones; that keeps the whole
          # cache dir readable by the post-job tar (the .debs are already 0644).
          mkdir -p /tmp/apt-archives/partial
          touch /tmp/apt-archives/lock
          echo 'Dir::Cache::archives "/tmp/apt-archives";' | sudo tee /etc/apt/apt.conf.d/01cache

      - name: Setup Dependencies
        run:  ./dependency.sh

      - name: Format Check
        run:  ${{github.workspace}}/format-check.sh

      - name: CppCheck
        run:  ${{github.workspace}}/cppcheck.sh

      - name: Build Release
        run:  ${{github.workspace}}/build.sh rel

      - name: Clang Tidy
        run:  ${{github.workspace}}/clang-tidy.sh

      - name: Artifacts
        run:  ${{github.workspace}}/delivery.sh
