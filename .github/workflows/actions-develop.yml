name: Develop

on: [push, pull_request]

jobs:
  linux-all-steps:
    if:       github.ref != 'refs/heads/release'
    runs-on:  ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Cache apt archives
        uses: actions/cache@v5
        with:
          # Cache only the completed .debs (runner-readable, 0644). NOT the whole
          # dir: apt hardens partial/ to _apt:root 0700 during download, which the
          # runner-owned post-job tar can't read (Permission denied on save).
          path: /tmp/apt-archives/*.deb
          key:  apt-${{hashFiles('.github/dependencies/linux')}}

      - name: Route apt downloads to the cache dir
        run: |
          # apt requires archives/ + archives/partial to exist before it will
          # download into a custom cache dir; create them, then point apt here.
          mkdir -p /tmp/apt-archives/partial
          echo 'Dir::Cache::archives "/tmp/apt-archives";' | sudo tee /etc/apt/apt.conf.d/01cache

      - name: Setup Dependencies
        run:  ./dependency.sh

      - name: Format Check
        run:  ./format-check.sh

      - name: CppCheck
        run:  ./cppcheck.sh

      - name: Build Develop
        run:  ./build.sh dev

      - name: Run with ASAN
        # The app stops itself through SIGINT once its first frame is drawn: no delay to
        # guess on a slow runner, and no timeout(1), whose uutils -k ends the run early
        timeout-minutes: 1
        run:  xvfb-run -a env PUREGLUI_STOP_AFTER_FRAME=1 ./run.sh dev

      - name: Clang Tidy
        run:  ./clang-tidy.sh

      - name: Build Unit Tests
        run:  ./build.sh ut

      # No xvfb: the unit suite is pure C++ with no window or GL.
      - name: Run Unit Tests
        run:  ./run.sh ut

      - name: Build Component Tests
        run:  ./build.sh ct

      # At 1.25x, the commonest scale that is not whole, so the px math and every placement
      # test meet a fraction: PUREGLUI_SCALE multiplies the DPI the OS gives
      - name: Run Component Tests
        run:  xvfb-run -a env PUREGLUI_SCALE=1.25 ./run.sh ct

      - name: Build Component Tests on Wayland
        run:  ./build.sh ct wl

      # Weston is the compositor, on its X11 backend in an Xvfb for a seat, which a headless one
      # lacks and which activates the window; its output smaller than the window, so fullscreen
      # shrinks it. Its desktop shell gives fullscreen, popups and an output's scale; with no GPU
      # on the runner Mesa draws on the CPU into shared memory. Spelled as Weston 10 takes it too,
      # so the same line runs on an older desktop. At 1.25x as above, so the UI's scale stands
      # apart from the output's buffer scale
      - name: Run Component Tests on Wayland
        timeout-minutes: 15
        run: |
          export XDG_RUNTIME_DIR=`mktemp -d`
          xvfb-run -a weston --backend=x11-backend.so --use-pixman --width=1024 --height=640 --socket=wayland-ci &
          for attempt in `seq 100`; do
              if [[ -S $XDG_RUNTIME_DIR/wayland-ci ]]; then
                  break
              fi
              sleep 0.1
          done
          # With no compositor every test skips and the suite passes, so a Weston that never
          # started fails the step instead
          [[ -S $XDG_RUNTIME_DIR/wayland-ci ]] || { echo "weston did not start"; exit 1; }
          WAYLAND_DISPLAY=wayland-ci PUREGLUI_SCALE=1.25 ./run.sh ct wl

      - name: Build Coverage
        run:  ./build.sh cov

      - name: Unit Tests Coverage
        run:  ./unit-tests-coverage.sh

  macos:
    if:       github.ref != 'refs/heads/release'
    runs-on:  macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key:  brew-${{hashFiles('.github/dependencies/macos')}}

      - name: Setup Dependencies
        run:  ./dependency.sh

      - name: Build Release
        run:  ./build.sh rel

      - name: Build Unit Tests
        run:  ./build.sh ut

      - name: Run Unit Tests
        run:  ./run.sh ut

      - name: Build Component Tests
        run:  ./build.sh ct

      # No xvfb/Mesa: the X11 GL suite is HAVE_X11-gated out here, so every
      # remaining component suite is CPU-only.
      - name: Run Component Tests
        run:  ./run.sh ct

  windows:
    if:       github.ref != 'refs/heads/release'
    runs-on:  windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Restore vcpkg cache
        id:   vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: C:/vcpkg/installed
          key:  vcpkg-x64-windows-release-${{hashFiles('.github/dependencies/windows')}}

      - name: Setup Dependencies
        if:   steps.vcpkg-cache.outputs.cache-hit != 'true'
        run:  ./dependency.sh

      - name: Save vcpkg cache
        if:   steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:/vcpkg/installed
          key:  vcpkg-x64-windows-release-${{hashFiles('.github/dependencies/windows')}}

      - name: Build Release
        env:
          VCPKG_TARGET_TRIPLET: x64-windows-release
          CMAKE_TOOLCHAIN_FILE: C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          MSYS_NO_PATHCONV: 1
        run:  ./build.sh rel

      - name: Build Unit Tests
        env:
          VCPKG_TARGET_TRIPLET: x64-windows-release
          CMAKE_TOOLCHAIN_FILE: C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          MSYS_NO_PATHCONV: 1
        run:  ./build.sh ut

      - name: Build Component Tests
        env:
          VCPKG_TARGET_TRIPLET: x64-windows-release
          CMAKE_TOOLCHAIN_FILE: C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          MSYS_NO_PATHCONV: 1
        run:  ./build.sh ct

      # Mesa (software GL) is cached and fetched independently of the vcpkg
      # cache gate so GL test coverage is deterministic on every run - the
      # runner has no hardware GL driver, so run.sh deploys Mesa and TestGlSmoke
      # exercises the full GL render path instead of the GL 1.1 early-return.
      # Restore + save rather than cache: the save runs only once the fetch has
      # succeeded. A plain cache step saves on failure too, and a half-fetched Mesa
      # under a key that never changes is restored by every run after it
      - name: Restore Mesa
        id:   mesa-cache
        uses: actions/cache/restore@v5
        with:
          path: 3rd/mesa
          key:  mesa-dist-win-release-msvc

      - name: Fetch Mesa
        if:   steps.mesa-cache.outputs.cache-hit != 'true'
        run:  ./mesa-windows.sh fetch

      - name: Save Mesa
        if:   steps.mesa-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: 3rd/mesa
          key:  mesa-dist-win-release-msvc

      # Prepend the vcpkg bin dir so the runtime DLLs (cairo/rsvg/freetype/glew/...)
      # resolve if applocal deploy misses any.
      - name: Run Unit Tests
        run: |
          export PATH="/c/vcpkg/installed/x64-windows-release/bin:$PATH"
          ./run.sh ut

      # The X11 corner-capture suite is compiled out here (HAVE_X11); TestGlSmoke
      # runs on Mesa, which run.sh deploys next to the binary. At 1.25x as on Linux
      - name: Run Component Tests
        run: |
          export PATH="/c/vcpkg/installed/x64-windows-release/bin:$PATH"
          PUREGLUI_SCALE=1.25 ./run.sh ct
